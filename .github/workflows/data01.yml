name: DATA-01 SQLite regression and Windows preview

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'docs/DATA-01*'
      - '.github/workflows/data01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SQLite migration on Linux
        run: python -m unittest discover -s tests -v

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SQLite migration on Windows
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
      - name: Build portable demonstration
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DCA-Data01-Preview --collect-all customtkinter --add-data "config;config" --add-data "img;img" --add-data "db;db" main.pyw
          $app = "dist/DCA-Data01-Preview"
          if (!(Test-Path "$app/DCA-Data01-Preview.exe")) { throw "Build missing executable" }
          New-Item -ItemType File -Path "$app/DCA-PREVIEW-MODE" -Force | Out-Null
          New-Item -ItemType Directory -Force -Path "$app/_internal/db" | Out-Null
          Copy-Item "tests/fixtures/data01_sample.csv" "$app/_internal/db/meu_diario_operacoes.csv"
          Copy-Item "docs/DATA-01_PREVIEW.txt" "$app/LEIA-ME.txt"
      - name: Upload Windows portable preview
        uses: actions/upload-artifact@v4
        with:
          name: DCA-Data01-Portable-Windows
          path: dist/DCA-Data01-Preview/
          retention-days: 14
          if-no-files-found: error
